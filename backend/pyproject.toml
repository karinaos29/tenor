[project]
name = "tenor-backend"
version = "0.0.1"
description = "Tenor: live copilot for high-pressure investment sales calls (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.5.4",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not deepgram and not finnhub'"
markers = [
    "deepgram: hits the real Deepgram API (needs DEEPGRAM_API_KEY); run with -m deepgram",
    "finnhub: hits the real Finnhub API (needs FINNHUB_API_KEY); run with -m finnhub",
]
