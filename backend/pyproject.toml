[project]
name = "tenor-backend"
version = "0.0.1"
description = "Tenor: live copilot for high-pressure investment sales calls (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.5.4",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "sentence-transformers>=6.1.0",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    # Listed directly only so Linux (the Railway image) can take the CPU build below.
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3",
]

[tool.uv]
package = false

# Linux gets PyTorch's CPU-only wheel (0.2 GB): the default Linux torch pulls CUDA and Triton,
# 17 wheels and 3.0 GB that a CPU server never uses. macOS keeps the regular PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not deepgram and not finnhub and not model'"
markers = [
    "deepgram: hits the real Deepgram API (needs DEEPGRAM_API_KEY); run with -m deepgram",
    "finnhub: hits the real Finnhub API (needs FINNHUB_API_KEY); run with -m finnhub",
    "model: loads the real sentence-embedding model (downloads ~90 MB once); run with -m model",
]
